<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b26" />
    <script>
      // The saved theme, before the first paint; src/ui/hooks/use-theme.ts takes over after that.
      // An unknown value matches no theme block, so the page keeps the default.
      try {
        const theme = localStorage.getItem('open-f75:theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <title>open-f75</title>
    <meta name="description" content="WebHID lighting controller for the AULA F75 keyboard" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
